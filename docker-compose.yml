version: "3.9"
services:
  app:
    build: .
    container_name: go-app
    command: ./app
    ports:
      -"8080:8080"
    environment:
      MYSQL_DSN: root:root@tcp(mysql:3306)/demo
    depends_on:
      - mysql
  
  mysql:
    image: mysql:8.0
    container_name: go-db
    ports:
      - "3306:3306"
    environments:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=demo

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: